services:
  db:
    image: postgres:16-alpine
    container_name: ekklesia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekklesia}
      POSTGRES_USER: ${POSTGRES_USER:-ekklesia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekklesia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ekklesia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ekklesia_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ekklesia_redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --bind 0.0.0.0

volumes:
  ekklesia_pgdata:
  ekklesia_redis_data:
